<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="tab-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="tab-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#06B6D4"/>
      <stop offset="70%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="340" fill="url(#tab-sky)"/>
  <circle cx="680" cy="90" r="45" fill="#FEF08A" opacity="0.8"/>

  <!-- Distant Java / Bali coastline silhouette -->
  <path d="M0 330 L180 300 L350 315 L520 295 L720 310 L800 325 L800 340 L0 340 Z" fill="#3B82F6" opacity="0.35"/>

  <!-- Turquoise Strait Sea -->
  <rect y="330" width="800" height="270" fill="url(#tab-sea)"/>

  <!-- Coral Reef Gradients in Shallow Water -->
  <ellipse cx="400" cy="460" rx="350" ry="80" fill="#14B8A6" opacity="0.4"/>
  <ellipse cx="360" cy="480" rx="260" ry="60" fill="#2DD4BF" opacity="0.5"/>

  <!-- White Sand Spit / Island -->
  <ellipse cx="380" cy="480" rx="220" ry="45" fill="#FEF3C7"/>
  <ellipse cx="370" cy="475" rx="180" ry="32" fill="#FFFBEB"/>

  <!-- Minimalist Trees / Lighthouse on Tabuhan -->
  <!-- Lighthouse / tower structure -->
  <rect x="360" y="420" width="8" height="45" fill="#DC2626"/>
  <rect x="357" y="415" width="14" height="6" fill="#F8FAFC"/>
  <!-- Small coastal palms / scrub -->
  <ellipse cx="330" cy="455" rx="20" ry="12" fill="#15803D"/>
  <ellipse cx="395" cy="458" rx="25" ry="14" fill="#166534"/>
  <ellipse cx="425" cy="460" rx="16" ry="10" fill="#15803D"/>

  <!-- Traditional Outrigger Boat (Jukung) -->
  <path d="M120 420 L210 420 L195 435 L135 435 Z" fill="#FFFFFF"/>
  <path d="M110 425 L100 420" stroke="#DC2626" stroke-width="2"/>
  <rect x="140" y="390" width="3" height="30" fill="#78350F"/>
  <polygon points="143,392 185,415 143,418" fill="#F97316"/>
  <!-- Outrigger bamboo float -->
  <line x1="110" y1="440" x2="210" y2="440" stroke="#FEF08A" stroke-width="4"/>

  <!-- Kite Surfer silhouette in background -->
  <path d="M600 240 Q620 220 640 240 Q620 230 600 240 Z" fill="#E11D48"/>
  <line x1="620" y1="235" x2="630" y2="350" stroke="#FFFFFF" stroke-width="1" opacity="0.7"/>

  <!-- Badge -->
  <rect x="30" y="30" width="220" height="36" rx="18" fill="#0369A1" fill-opacity="0.85"/>
  <circle cx="50" cy="48" r="5" fill="#38BDF8"/>
  <text x="65" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#F7F4EC">PULAU TABUHAN STRAIT</text>
</svg>
