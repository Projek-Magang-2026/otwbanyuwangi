<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sea-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="coral1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="coral2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Deep Sea -->
  <rect width="800" height="600" fill="url(#sea-grad)"/>

  <!-- Light Rays from surface -->
  <polygon points="120,0 220,0 380,600 240,600" fill="#FFFFFF" opacity="0.12"/>
  <polygon points="340,0 480,0 650,600 470,600" fill="#FFFFFF" opacity="0.15"/>
  <polygon points="560,0 680,0 800,450 720,600" fill="#FFFFFF" opacity="0.08"/>

  <!-- Sea Bed / Wall Reef -->
  <path d="M0 600 L0 320 C80 340 140 400 220 380 C320 360 380 430 480 410 C580 390 660 460 800 430 L800 600 Z" fill="#082F49"/>

  <!-- Coral Formations -->
  <!-- Brain coral / fan -->
  <path d="M60 480 C30 420 100 370 140 410 C180 360 230 420 190 470 Z" fill="url(#coral1)"/>
  <!-- Sea fans / staghorn -->
  <path d="M520 480 Q510 390 480 340 M520 450 Q540 380 570 330 M520 420 Q480 370 450 360 M520 440 Q550 410 580 400" stroke="#F43F5E" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Yellow Coral Bush -->
  <circle cx="340" cy="460" r="45" fill="url(#coral2)"/>
  <circle cx="370" cy="445" r="35" fill="#F59E0B"/>
  <circle cx="315" cy="445" r="30" fill="#D97706"/>

  <!-- Tropical Fish Schools -->
  <!-- Clownfish / Tangs -->
  <g fill="#F97316">
    <!-- Fish 1 -->
    <path d="M260 280 C290 270 320 285 335 295 L345 285 L340 295 L345 305 L335 295 C320 305 290 320 260 310 Z"/>
    <path d="M285 275 L295 273 L290 317 L280 315 Z" fill="#FFFFFF"/>
    <!-- Fish 2 -->
    <path d="M380 230 C405 220 430 232 442 240 L450 232 L446 240 L450 248 L442 240 C430 248 405 260 380 252 Z" transform="scale(0.85) translate(80, 50)"/>
    <!-- Fish 3 -->
    <path d="M420 320 C440 312 460 322 470 328 L476 322 L473 328 L476 334 L470 328 C460 334 440 344 420 338 Z" fill="#38BDF8"/>
  </g>

  <!-- Sea Turtle Silhouette -->
  <g transform="translate(620, 160) rotate(-15) scale(0.65)" fill="#164E63">
    <ellipse cx="60" cy="40" rx="40" ry="25"/>
    <circle cx="105" cy="40" r="12"/>
    <path d="M70 20 C85 5 100 -5 105 0 C100 15 80 20 70 20 Z"/>
    <path d="M70 60 C85 75 100 85 105 80 C100 65 80 60 70 60 Z"/>
    <path d="M30 25 C20 15 10 15 15 22 C20 28 25 30 30 25 Z"/>
    <path d="M30 55 C20 65 10 65 15 58 C20 52 25 50 30 55 Z"/>
  </g>

  <!-- Bubbles -->
  <circle cx="280" cy="220" r="4" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="286" cy="190" r="6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="282" cy="150" r="3" fill="#FFFFFF" opacity="0.7"/>

  <!-- Badge -->
  <rect x="30" y="30" width="240" height="36" rx="18" fill="#0C4A6E" fill-opacity="0.85"/>
  <circle cx="50" cy="48" r="5" fill="#38BDF8"/>
  <text x="65" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#F7F4EC">PULAU MENJANGAN REEF</text>
</svg>
